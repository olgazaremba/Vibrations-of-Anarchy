<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AR Book</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-extras@6.1.1/dist/aframe-extras.min.js"></script>
    <style>
      * { margin: 0; padding: 0; }
      body { overflow: hidden; }
      #start-screen {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: #000;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 9999;
}

#start-screen img {
  max-width: 80%;
  max-height: 70vh;
  object-fit: contain;
}

#start-btn {
  margin-top: 32px;
  background: #CB9601;
  color: #000;
  border: none;
  padding: 16px 48px;
  font-size: 20px;
  font-weight: bold;
  letter-spacing: 2px;
  cursor: pointer;
  border-radius: 4px;
}
    </style>
  </head>
  <body>
    <div id="start-screen">
  <img src="images/start.png" alt="start" />
  <button id="start-btn">Start</button>
</div>
    <a-scene
      mindar-image="imageTargetSrc: targets.mind; autoStart: true; filterMinCF: 0.001; filterBeta: 0.001;"
      color-space="sRGB"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >
      <a-assets>
        <a-asset-item id="hammer-model" src="hammer/cross_pein_hammer_4k.gltf"></a-asset-item>
        <a-asset-item id="poeta-model" src="poet/scene-tile/PoetaCarpinteiro.gltf"></a-asset-item>
        <a-asset-item id="circle-model" src="circle/newCircle.gltf"></a-asset-item>
        <img id="phrase1" src="images/phrase1.png" crossorigin="anonymous" />
        <img id="phrase2" src="images/phrase2.png" crossorigin="anonymous" />
        <img id="phrase3" src="images/phrase3.png" crossorigin="anonymous" />
        <img id="phrase4" src="images/phrase4.png" crossorigin="anonymous" />
        <img id="phrase5" src="images/phrase5.png" crossorigin="anonymous" />
        <img id="phrase6" src="images/phrase6.png" crossorigin="anonymous" />
        <img id="phrase7" src="images/phrase7.png" crossorigin="anonymous" />
        <img id="phrase8" src="images/phrase8.png" crossorigin="anonymous" />
        <img id="tooltip" src="images/tooltip.png" crossorigin="anonymous" />
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0" id="target-entity">

        <a-gltf-model
          id="hammer"
          src="#hammer-model"
          position="0.1 0.05 0.1"
          rotation="90 180 -135"
          scale="3 3 3"
          animation__hit="property: rotation; to: 90 180 -105; dur: 180; startEvents: hit; easing: easeInQuad"
          animation__return="property: rotation; to: 90 180 -135; dur: 180; startEvents: return; easing: easeOutQuad"
        ></a-gltf-model>

        <a-image id="p1" src="#phrase1"
          position="-0.22 0.2 0.05" width="0.405" height="0.0599"
          scale="0.001 0.001 1" visible="false"></a-image>
        <a-image id="p2" src="#phrase2"
          position="0.22 0.2 0.05" width="0.405" height="0.0578"
          scale="0.001 0.001 1" visible="false"></a-image>
        <a-image id="p3" src="#phrase3"
          position="-0.22 0.14 0.05" width="0.405" height="0.0559"
          scale="0.001 0.001 1" visible="false"></a-image>
        <a-image id="p4" src="#phrase4"
          position="0.22 0.14 0.05" width="0.405" height="0.0517"
          scale="0.001 0.001 1" visible="false"></a-image>
        <a-image id="p5" src="#phrase5"
          position="-0.22 -0.15 0.05" width="0.272" height="0.0853"
          scale="0.001 0.001 1" visible="false"></a-image>
        <a-image id="p6" src="#phrase6"
          position="0.22 -0.15 0.05" width="0.312" height="0.0601"
          scale="0.001 0.001 1" visible="false"></a-image>
        <a-image id="p7" src="#phrase7"
          position="-0.22 -0.25 0.05" width="0.369" height="0.057"
          scale="0.001 0.001 1" visible="false"></a-image>
        <a-image id="p8" src="#phrase8"
          position="0.22 -0.25 0.05" width="0.369" height="0.0621"
          scale="0.001 0.001 1" visible="false"></a-image>

        <a-image id="tooltip-img" src="#tooltip"
          position="0 0 0.3" width="0.3" height="0.3"
          visible="false"></a-image>

      </a-entity>

      <a-entity mindar-image-target="targetIndex: 1" id="target-entity-2">
        <a-gltf-model
          id="poeta"
          src="#poeta-model"
          position="-0.5 -0.7 0"
          rotation="0 0 -180"
          scale="-0.35 0.35 0.35"
          visible="false"
          animation-mixer="clip: Action.002; loop: repeat"
        ></a-gltf-model>
      </a-entity>
      <a-entity mindar-image-target="targetIndex: 2" id="target-entity-3">
        <a-gltf-model
          id="circle"
          src="#circle-model"
          position="0 -0.9 0"
          rotation="0 0 0"
          scale="0.28 0.28 0.28"
          animation-mixer="clip: *; loop: repeat"
        ></a-gltf-model>
      </a-entity>

    </a-scene>

    <script>
document.getElementById('start-btn').addEventListener('click', function () {
  const screen = document.getElementById('start-screen')
  screen.style.display = 'none'
})
      const hammer = document.getElementById('hammer')
      const tooltipImg = document.getElementById('tooltip-img')
      const hammerSound = new Audio('sounds/hammer.mp3')
      const lyreMusic = new Audio('sounds/lyre.mp3')
      const poetaMusic = new Audio('sounds/poema.mp3')
      lyreMusic.loop = true
      let musicStarted = false
      let hammerVisible = false


      const phrases = [
        { el: document.getElementById('p1'), finalPos: '-0.22 0.2 0.05' },
        { el: document.getElementById('p2'), finalPos: '0.22 0.2 0.05' },
        { el: document.getElementById('p3'), finalPos: '-0.22 0.14 0.05' },
        { el: document.getElementById('p4'), finalPos: '0.22 0.14 0.05' },
        { el: document.getElementById('p5'), finalPos: '-0.22 -0.15 0.05' },
        { el: document.getElementById('p6'), finalPos: '0.22 -0.15 0.05' },
        { el: document.getElementById('p7'), finalPos: '-0.22 -0.25 0.05' },
        { el: document.getElementById('p8'), finalPos: '0.22 -0.25 0.05' },
      ]

      let animating = false
      let step = 0

      const targetEntity = document.getElementById('target-entity')
      const targetEntity2 = document.getElementById('target-entity-2')
      const poetaModel = document.getElementById('poeta')

      let poetaCleanupTimer = null

      targetEntity2.addEventListener('targetFound', () => {
        if (poetaCleanupTimer) { clearTimeout(poetaCleanupTimer); poetaCleanupTimer = null }
        hammerVisible = false
          poetaModel.setAttribute('visible', true)
          poetaMusic.currentTime = 0
          poetaMusic.play()
        })

      targetEntity2.addEventListener('targetLost', () => {
        if (!poetaCleanupTimer) {
        poetaCleanupTimer = setTimeout(() => {
            poetaMusic.pause()
            poetaMusic.currentTime = 0
            poetaModel.setAttribute('visible', false)
            poetaCleanupTimer = null
          }, 5000)
        }
      })

      let tooltipTimer = null

      targetEntity.addEventListener('targetLost', () => {
        hammerVisible = false
        lyreMusic.pause()
        tooltipImg.setAttribute('visible', false)
        tooltipImg.removeAttribute('animation__pulse')
        if (tooltipTimer) {
          clearTimeout(tooltipTimer)
          tooltipTimer = null
        }
      })

      targetEntity.addEventListener('targetFound', () => {
        hammerVisible = true
        if (musicStarted) lyreMusic.play()
        tooltipTimer = setTimeout(() => {
          tooltipImg.setAttribute('visible', true)
          tooltipImg.setAttribute('animation__pulse',
            'property: position; from: 0 0 0.3; to: 0 0 0.45; dur: 800; loop: true; dir: alternate; easing: easeInOutSine')
        }, 2000)
      })

document.addEventListener('click', function () {
  if (!hammerVisible) return
  if (!targetEntity.object3D.visible) return
        if (!musicStarted) {
          lyreMusic.play()
          musicStarted = true
        }

        tooltipImg.setAttribute('visible', false)
        tooltipImg.removeAttribute('animation__pulse')

        if (animating || step >= phrases.length) return
        animating = true

        hammerSound.currentTime = 0
        hammerSound.play()

        hammer.emit('hit')

        setTimeout(() => {
          hammer.emit('return')

          const phrase = phrases[step]
          const el = phrase.el

          el.setAttribute('visible', true)
          el.setAttribute('position', '0 0 0.05')
          el.setAttribute('scale', '0.1 0.1 1')

          setTimeout(() => {
            el.setAttribute('animation__grow',
              'property: scale; from: 0.1 0.1 1; to: 1.5 1.5 1; dur: 700; easing: easeOutBack')
          }, 50)

          setTimeout(() => {
            el.setAttribute('animation__shrink',
              'property: scale; to: 1 1 1; dur: 500; easing: easeInOutQuad')
            el.setAttribute('animation__move',
              `property: position; to: ${phrase.finalPos}; dur: 800; easing: easeInOutQuad`)
          }, 500)

          setTimeout(() => {
            animating = false
            step++
            tooltipImg.setAttribute('visible', true)
            tooltipImg.setAttribute('animation__pulse',
              'property: position; from: 0 0 0.3; to: 0 0 0.45; dur: 800; loop: true; dir: alternate; easing: easeInOutSine')

            if (step >= phrases.length) {
              tooltipImg.setAttribute('visible', false)
              tooltipImg.removeAttribute('animation__pulse')
              setTimeout(() => {
                hammer.setAttribute('visible', false)
              }, 600)
            }
          }, 1100)

        }, 360)
      })
    </script>
  </body>
</html>
