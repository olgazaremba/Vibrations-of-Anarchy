<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>AR Book — Model Viewer Overlay</title>

    <!-- A-Frame and MindAR are used only to open the camera and detect image targets. -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <!-- model-viewer is used to display animated 3D models as a transparent HTML overlay. -->
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        font-family: Arial, Helvetica, sans-serif;
      }

      /* MindAR stays behind the overlay. This is the layer that opens the camera feed. */
      a-scene {
        position: fixed !important;
        inset: 0 !important;
        width: 100vw !important;
        height: 100vh !important;
        z-index: 0;
      }

      /* Transparent layer used to display the selected 3D model over the camera feed. */
      #model-overlay {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        z-index: 10;
        display: none;
        pointer-events: none;
        background: transparent;
      }

      #ar-model {
        width: 100vw;
        height: 100vh;
        background: transparent;
        --poster-color: transparent;
      }

      /* Initial instruction shown before a target is detected. */
      #scan-hint {
        position: fixed;
        left: 50%;
        top: 24px;
        transform: translateX(-50%);
        z-index: 20;
        max-width: calc(100vw - 32px);
        padding: 10px 14px;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.55);
        color: white;
        font-size: 14px;
        text-align: center;
        pointer-events: none;
      }

      #scan-hint.hidden {
        display: none;
      }
    </style>
  </head>

  <body>
    <div id="scan-hint">Point the camera at a target.</div>

    <!-- The 3D model is displayed over the camera feed. The src is set only after target detection. -->
    <div id="model-overlay">
      <model-viewer
        id="ar-model"
        src=""
        autoplay
        camera-controls="false"
        interaction-prompt="none"
        disable-zoom
        disable-pan
        shadow-intensity="0"
        exposure="1"
        reveal="auto"
      ></model-viewer>
    </div>

    <!-- MindAR opens the camera and detects targets. The targets are empty and work only as triggers. -->
    <a-scene
      mindar-image="imageTargetSrc: targets.mind; autoStart: true; filterMinCF: 0.001; filterBeta: 0.001; uiScanning: no;"
      color-space="sRGB"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
      renderer="alpha: true; antialias: true; colorManagement: true"
    >
      <a-assets>
        <a-asset-item id="hammer-model" src="cross_pein_hammer_4k.gltf"></a-asset-item>
        <a-asset-item id="poeta-model" src="scene tile/PoetaCarpinteiro.gltf"></a-asset-item>
      </a-assets>

      <a-camera id="camera" position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity id="target-entity" mindar-image-target="targetIndex: 0"></a-entity>
      <a-entity id="target-entity-2" mindar-image-target="targetIndex: 1"></a-entity>
    </a-scene>

    <script>
      const modelOverlay = document.getElementById('model-overlay')
      const arModel = document.getElementById('ar-model')
      const scanHint = document.getElementById('scan-hint')

      const targetEntity = document.getElementById('target-entity')
      const targetEntity2 = document.getElementById('target-entity-2')

      const lyreMusic = new Audio('sounds/lyre.mp3')
      const poetaMusic = new Audio('sounds/poema.mp3')

      lyreMusic.loop = true
      poetaMusic.loop = false
      lyreMusic.preload = 'auto'
      poetaMusic.preload = 'auto'

      let currentAudio = null
      let currentScene = null

      /*
        This value defines the default model orientation.
        The current value rotates the model 180 degrees around the Z axis.
      */
      const MODEL_VERTICAL_ORIENTATION = '0deg 0deg 180deg'

      function stopCurrentAudio() {
        if (currentAudio) {
          currentAudio.pause()
          currentAudio.currentTime = 0
          currentAudio = null
        }
      }

      function playAudioOnTarget(audio) {
        stopCurrentAudio()
        currentAudio = audio
        currentAudio.currentTime = 0

        const playPromise = currentAudio.play()

        if (playPromise !== undefined) {
          playPromise.catch((error) => {
            /*
              Some browsers block audio playback without a previous user gesture.
              The app still tries to play the audio automatically when the target is detected,
              as requested. If blocked, the error is logged for debugging.
            */
            console.warn('Audio playback was blocked by the browser:', error)
          })
        }
      }

      function showModel(options) {
        const {
          sceneName,
          src,
          animationName,
          audio,
          orientation = MODEL_VERTICAL_ORIENTATION,
          scale = '1 1 1',
          cameraOrbit = '0deg 75deg 2.5m'
        } = options

        currentScene = sceneName
        scanHint.classList.add('hidden')
        modelOverlay.style.display = 'block'

        if (arModel.getAttribute('src') !== src) {
          arModel.setAttribute('src', src)
        }

        arModel.setAttribute('orientation', orientation)
        arModel.setAttribute('scale', scale)
        arModel.setAttribute('camera-orbit', cameraOrbit)

        if (animationName) {
          arModel.setAttribute('animation-name', animationName)
          arModel.setAttribute('autoplay', '')
        } else {
          arModel.removeAttribute('animation-name')
          arModel.setAttribute('autoplay', '')
        }

        arModel.addEventListener('load', () => {
          try {
            arModel.play()
          } catch (error) {
            console.warn('The model animation could not be started:', error)
          }
        }, { once: true })

        if (audio) {
          playAudioOnTarget(audio)
        }
      }

      targetEntity.addEventListener('targetFound', () => {
        showModel({
          sceneName: 'hammer',
          src: 'cross_pein_hammer_4k.gltf',
          audio: lyreMusic,
          orientation: MODEL_VERTICAL_ORIENTATION,
          scale: '1 1 1',
          cameraOrbit: '0deg 75deg 2.5m'
        })
      })

      targetEntity2.addEventListener('targetFound', () => {
        showModel({
          sceneName: 'poeta',
          src: 'scene tile/PoetaCarpinteiro.gltf',
          animationName: 'Action.002',
          audio: poetaMusic,
          orientation: MODEL_VERTICAL_ORIENTATION,
          scale: '1 1 1',
          cameraOrbit: '0deg 75deg 2.5m'
        })
      })

      targetEntity.addEventListener('targetLost', () => {
        // Intentionally empty: the model remains visible after the target is lost.
      })

      targetEntity2.addEventListener('targetLost', () => {
        // Intentionally empty: the model remains visible after the target is lost.
      })
    </script>
  </body>
</html>
