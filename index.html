<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AR Book</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
      * { margin: 0; padding: 0; }
      body { overflow: hidden; }
    </style>
  </head>
  <body>
    <a-scene
      mindar-image="imageTargetSrc: targets.mind; autoStart: true; filterMinCF: 0.001; filterBeta: 0.001;"
      color-space="sRGB"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >
      <a-assets>
        <a-asset-item id="hammer-model" src="cross_pein_hammer_4k.gltf"></a-asset-item>
        <img id="phrase1" src="images/phrase1.png" crossorigin="anonymous" />
        <img id="phrase2" src="images/phrase2.png" crossorigin="anonymous" />
        <img id="phrase3" src="images/phrase3.png" crossorigin="anonymous" />
        <img id="phrase4" src="images/phrase4.png" crossorigin="anonymous" />
        <img id="phrase5" src="images/phrase5.png" crossorigin="anonymous" />
        <img id="phrase6" src="images/phrase6.png" crossorigin="anonymous" />
        <img id="phrase7" src="images/phrase7.png" crossorigin="anonymous" />
        <img id="phrase8" src="images/phrase8.png" crossorigin="anonymous" />
        <img id="tooltip" src="images/tooltip.png" crossorigin="anonymous" />
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0" id="target-entity">

        <a-gltf-model
          id="hammer"
          src="#hammer-model"
          position="0.1 0.05 0.1"
          rotation="90 180 -135"
          scale="3 3 3"
          animation__hit="property: rotation; to: 90 180 -105; dur: 180; startEvents: hit; easing: easeInQuad"
          animation__return="property: rotation; to: 90 180 -135; dur: 180; startEvents: return; easing: easeOutQuad"
        ></a-gltf-model>

        <a-image id="p1" src="#phrase1"
          position="-0.22 0.26 0.05" width="0.45" height="0.0666"
          scale="0.001 0.001 1" visible="false"></a-image>

        <a-image id="p2" src="#phrase2"
          position="0.22 0.26 0.05" width="0.45" height="0.0642"
          scale="0.001 0.001 1" visible="false"></a-image>

        <a-image id="p3" src="#phrase3"
          position="-0.22 0.14 0.05" width="0.45" height="0.0621"
          scale="0.001 0.001 1" visible="false"></a-image>

        <a-image id="p4" src="#phrase4"
          position="0.22 0.14 0.05" width="0.45" height="0.0574"
          scale="0.001 0.001 1" visible="false"></a-image>

        <a-image id="p5" src="#phrase5"
          position="-0.22 -0.15 0.05" width="0.34" height="0.1066"
          scale="0.001 0.001 1" visible="false"></a-image>

        <a-image id="p6" src="#phrase6"
          position="0.22 -0.15 0.05" width="0.39" height="0.0751"
          scale="0.001 0.001 1" visible="false"></a-image>

        <a-image id="p7" src="#phrase7"
          position="-0.22 -0.25 0.05" width="0.41" height="0.0633"
          scale="0.001 0.001 1" visible="false"></a-image>

        <a-image id="p8" src="#phrase8"
          position="0.22 -0.25 0.05" width="0.41" height="0.0690"
          scale="0.001 0.001 1" visible="false"></a-image>

        <a-image id="tooltip-img" src="#tooltip"
          position="0 0 0.3" width="0.3" height="0.3"
          visible="false"></a-image>

      </a-entity>
    </a-scene>

    <script>
      const hammer = document.getElementById('hammer')
      const tooltipImg = document.getElementById('tooltip-img')
      const hammerSound = new Audio('sounds/hammer.mp3')
      const lyreMusic = new Audio('sounds/lyre.mp3')
      lyreMusic.loop = true
      let musicStarted = false

      const phrases = [
        { el: document.getElementById('p1'), finalPos: '-0.22 0.26 0.05' },
        { el: document.getElementById('p2'), finalPos: '0.22 0.26 0.05' },
        { el: document.getElementById('p3'), finalPos: '-0.22 0.14 0.05' },
        { el: document.getElementById('p4'), finalPos: '0.22 0.14 0.05' },
        { el: document.getElementById('p5'), finalPos: '-0.22 -0.15 0.05' },
        { el: document.getElementById('p6'), finalPos: '0.22 -0.15 0.05' },
        { el: document.getElementById('p7'), finalPos: '-0.22 -0.25 0.05' },
        { el: document.getElementById('p8'), finalPos: '0.22 -0.25 0.05' },
      ]

      let animating = false
      let step = 0

      const targetEntity = document.getElementById('target-entity')

      let tooltipTimer = null

      targetEntity.addEventListener('targetLost', () => {
        lyreMusic.pause()
        tooltipImg.setAttribute('visible', false)
        tooltipImg.removeAttribute('animation__pulse')
        if (tooltipTimer) {
        clearTimeout(tooltipTimer)
        tooltipTimer = null
        }
      })

      targetEntity.addEventListener('targetFound', () => {
        if (musicStarted) lyreMusic.play()
        tooltipTimer = setTimeout(() => {
        tooltipImg.setAttribute('visible', true)
        tooltipImg.setAttribute('animation__pulse',
          'property: position; from: 0 0 0.3; to: 0 0 0.45; dur: 800; loop: true; dir: alternate; easing: easeInOutSine')
        }, 30000)
        })

      document.addEventListener('click', function () {
        if (!musicStarted) {
          lyreMusic.play()
          musicStarted = true
        }

        tooltipImg.setAttribute('visible', false)
        tooltipImg.removeAttribute('animation__pulse')

        if (animating || step >= phrases.length) return
        animating = true

        hammerSound.currentTime = 0
        hammerSound.play()

        hammer.emit('hit')

        setTimeout(() => {
          hammer.emit('return')

          const phrase = phrases[step]
          const el = phrase.el

          el.setAttribute('visible', true)
          el.setAttribute('position', '0 0 0.05')
          el.setAttribute('scale', '0.1 0.1 1')

          setTimeout(() => {
            el.setAttribute('animation__grow',
              'property: scale; from: 0.1 0.1 1; to: 1.5 1.5 1; dur: 700; easing: easeOutBack')
          }, 50)

          setTimeout(() => {
            el.setAttribute('animation__shrink',
              'property: scale; to: 1 1 1; dur: 500; easing: easeInOutQuad')
            el.setAttribute('animation__move',
              `property: position; to: ${phrase.finalPos}; dur: 800; easing: easeInOutQuad`)
          }, 500)

          setTimeout(() => {
            animating = false
            step++
            tooltipImg.setAttribute('visible', true)
            tooltipImg.setAttribute('animation__pulse',
              'property: position; from: 0 0 0.3; to: 0 0 0.45; dur: 800; loop: true; dir: alternate; easing: easeInOutSine')

            if (step >= phrases.length) {
              tooltipImg.setAttribute('visible', false)
              tooltipImg.removeAttribute('animation__pulse')
              setTimeout(() => {
                hammer.setAttribute('visible', false)
              }, 600)
            }
          }, 1100)

        }, 360)
      })
    </script>
  </body>
</html>
