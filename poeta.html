<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>O Poeta Carpinteiro</title>

    <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.134.0/build/three.module.js",
        "three/examples/jsm/loaders/GLTFLoader.js": "https://cdn.jsdelivr.net/npm/three@0.134.0/examples/jsm/loaders/GLTFLoader.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.134.0/examples/jsm/",
        "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.134.0/examples/jsm/"
      }
    }
    </script>

    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { overflow: hidden; background: #000; }
      #mindar-container {
        position: fixed; top: 0; left: 0;
        width: 100vw; height: 100vh;
      }
      #mindar-container video,
      #mindar-container canvas {
        position: fixed !important; top: 0 !important; left: 0 !important;
        width: 100vw !important; height: 100vh !important;
        object-fit: cover !important;
      }
      #btn-voltar {
        position: fixed; top: 20px; left: 20px; z-index: 10000;
        padding: 12px 18px; background: rgba(0,0,0,0.72); color: #fff;
        font-size: 15px; font-family: sans-serif;
        border: 1.5px solid rgba(255,255,255,0.35); border-radius: 12px;
        cursor: pointer; backdrop-filter: blur(6px);
      }
      #hint {
        position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%);
        background: rgba(0,0,0,0.65); color: #fff; font-size: 14px;
        font-family: sans-serif; padding: 10px 20px; border-radius: 20px;
        pointer-events: none; transition: opacity 0.6s;
        backdrop-filter: blur(4px); white-space: nowrap; z-index: 10000;
      }
    </style>
  </head>
  <body>

    <div id="mindar-container"></div>
    <button id="btn-voltar" onclick="window.location.href='index.html'">← Voltar</button>
    <div id="hint">Aponte a câmera para o Azulejo</div>

    <script type="module">
      import * as THREE from 'three'
      import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js'
      import { MindARThree } from 'https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js'

      const hint = document.getElementById('hint')
      const poetaMusic = new Audio('sounds/poema.mp3')

      // ── 1. MindAR ─────────────────────────────────────────────────
      const mindarThree = new MindARThree({
        container: document.getElementById('mindar-container'),
        imageTargetSrc: 'targets.mind',
        maxTrack: 1,
        uiLoading: 'no',
        uiError: 'no',
        uiScanning: 'no',
      })

      const { renderer, scene, camera } = mindarThree

      // ── 2. Luz ────────────────────────────────────────────────────
      scene.add(new THREE.AmbientLight(0xffffff, 1.5))
      const dirLight = new THREE.DirectionalLight(0xffffff, 1)
      dirLight.position.set(1, 2, 1)
      scene.add(dirLight)

      // ── 3. Anchor ─────────────────────────────────────────────────
      const anchor = mindarThree.addAnchor(0)

      // ── 4. Modelo — carregado e adicionado ao anchor desde o início
      let mixer = null

      const loader = new GLTFLoader()
      // NOTA: se a pasta tem espaço no nome, usa o nome codificado
      loader.load(
        'scene-tile/PoetaCarpinteiro.gltf',
        (gltf) => {
          console.log('Modelo carregado ✅')
          const model = gltf.scene

          // Ajusta rotação/escala ao teu modelo
          model.rotation.set(Math.PI / 2, 0, -Math.PI)
          model.scale.set(0.4, 0.4, 0.4)
          // Posição relativa ao centro do target (ajusta Y para elevar o modelo)
          model.position.set(0, 0, 0)

          // O modelo vive SEMPRE no anchor — o anchor segue o target
          anchor.group.add(model)

          if (gltf.animations?.length > 0) {
            mixer = new THREE.AnimationMixer(model)
            const clip = THREE.AnimationClip.findByName(gltf.animations, 'Action.002')
              || gltf.animations[0]
            mixer.clipAction(clip).play()
          }
        },
        (xhr) => console.log('Carregando:', Math.round(xhr.loaded / xhr.total * 100) + '%'),
        (err) => console.error('Erro modelo:', err)
      )

      // ── 5. Eventos ────────────────────────────────────────────────
      anchor.onTargetFound = () => {
        console.log('TARGET FOUND ✅')
        hint.style.opacity = '0'
        poetaMusic.currentTime = 0
        poetaMusic.play().catch(() => {})
      }

      anchor.onTargetLost = () => {
  hint.style.opacity = '1'
  // não fazer nada — modelo fica no último lugar conhecido
}

      // ── 6. Start ──────────────────────────────────────────────────
      try {
        await mindarThree.start()
        console.log('MindAR iniciado ✅')
      } catch(e) {
        console.error('Erro no start:', e)
      }

      const clock = new THREE.Clock()
      renderer.setAnimationLoop(() => {
        if (mixer) mixer.update(clock.getDelta())
        renderer.render(scene, camera)
      })

    </script>
  </body>
</html>
