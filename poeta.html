<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>O Poeta Carpinteiro</title>

    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { overflow: hidden; background: #000; }

      #video {
        position: fixed;
        top: 0; left: 0;
        width: 100vw; height: 100vh;
        object-fit: cover;
        z-index: 0;
      }

      #canvas {
        position: fixed;
        top: 0; left: 0;
        width: 100vw; height: 100vh;
        z-index: 1;
        pointer-events: none;
      }

      #btn-voltar {
        position: fixed;
        top: 20px; left: 20px;
        z-index: 10000;
        padding: 12px 18px;
        background: rgba(0,0,0,0.72);
        color: #fff;
        font-size: 15px;
        font-family: sans-serif;
        border: 1.5px solid rgba(255,255,255,0.35);
        border-radius: 12px;
        cursor: pointer;
        backdrop-filter: blur(6px);
      }

      #hint {
        position: fixed;
        bottom: 32px; left: 50%;
        transform: translateX(-50%);
        background: rgba(0,0,0,0.65);
        color: #fff;
        font-size: 14px;
        font-family: sans-serif;
        padding: 10px 20px;
        border-radius: 20px;
        pointer-events: none;
        transition: opacity 0.6s;
        backdrop-filter: blur(4px);
        white-space: nowrap;
        z-index: 10000;
      }
    </style>
  </head>
  <body>

    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
    <button id="btn-voltar" onclick="window.location.href='index.html'">← Voltar</button>
    <div id="hint">Aponte a câmera para a imagem do livro</div>

    <script type="module">
      import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.134.0/build/three.module.js'
      import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.134.0/examples/jsm/loaders/GLTFLoader.js'
      import { MindARThree } from 'https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js'

      const hint = document.getElementById('hint')
      const canvas = document.getElementById('canvas')
      const poetaMusic = new Audio('sounds/poema.mp3')

      // ── 1. MindAR + Three.js ──────────────────────────────────────
      const mindarThree = new MindARThree({
        container: document.body,
        imageTargetSrc: 'targets.mind',
        maxTrack: 1,
        uiLoading: 'no',
        uiError: 'no',
        uiScanning: 'no',
      })

      const { renderer, scene, camera } = mindarThree

      // Usa o canvas existente em vez de criar um novo
      document.body.removeChild(renderer.domElement)
      renderer.domElement.style.cssText = `
        position: fixed; top: 0; left: 0;
        width: 100vw; height: 100vh;
        z-index: 1; pointer-events: none;
      `
      document.body.appendChild(renderer.domElement)

      // ── 2. Luz ────────────────────────────────────────────────────
      const ambientLight = new THREE.AmbientLight(0xffffff, 1.2)
      scene.add(ambientLight)
      const dirLight = new THREE.DirectionalLight(0xffffff, 1)
      dirLight.position.set(1, 2, 1)
      scene.add(dirLight)

      // ── 3. Modelo ─────────────────────────────────────────────────
      let mixer = null
      const loader = new GLTFLoader()

      const anchor = mindarThree.addAnchor(0)

      loader.load('scene tile/PoetaCarpinteiro.gltf', (gltf) => {
        const model = gltf.scene
        model.rotation.set(Math.PI / 2, 0, -Math.PI)
        model.scale.set(-0.4, 0.4, 0.4)
        model.position.set(0, 0, 0)

        anchor.group.add(model)

        if (gltf.animations?.length > 0) {
          mixer = new THREE.AnimationMixer(model)
          const clip = THREE.AnimationClip.findByName(gltf.animations, 'Action.002')
            || gltf.animations[0]
          mixer.clipAction(clip).play()
        }

        console.log('Modelo carregado com sucesso')
      }, undefined, (err) => {
        console.error('Erro ao carregar modelo:', err)
      })

      // ── 4. Eventos da target ──────────────────────────────────────
      anchor.onTargetFound = () => {
        hint.style.opacity = '0'
        poetaMusic.currentTime = 0
        poetaMusic.play().catch(() => {})
      }

      anchor.onTargetLost = () => {
        hint.style.opacity = '1'
        poetaMusic.pause()
        poetaMusic.currentTime = 0
      }

      // ── 5. Start ──────────────────────────────────────────────────
      await mindarThree.start()

      const clock = new THREE.Clock()
      renderer.setAnimationLoop(() => {
        const delta = clock.getDelta()
        if (mixer) mixer.update(delta)
        mindarThree.renderer.render(scene, camera)
      })

    </script>
  </body>
</html>
